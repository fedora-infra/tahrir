name: Checking backend code quality
on: [push, pull_request]
jobs:
  ci-fe:
    runs-on: ubuntu-latest
    container: fedorapython/fedora-python-tox:latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout the codebase current state
        uses: actions/checkout@v5
      - name: Install the base required dependencies
        run: dnf install --assumeyes --setopt=install_weak_deps=False poetry tox
      - name: Mark this directory as safe for Git
        run: git config --global --add safe.directory $PWD
      - name: Install the backend project service
        run: poetry check && poetry install
      - name: Execute the backend quality checks
        run: poetry run ruff check --diff tahrir/ tests/
      - name: Execute the backend formatting checks
        run: poetry run ruff format --diff tahrir/ tests/
