- name: Install RPM packages
  become: true
  dnf:
    name:
      - poetry
      - gcc
      - libffi-devel
      - python3.13
      - libpq-devel
      - python3.13-devel
      - npm
      - supervisor
    state: present
    install_weak_deps: false

- name: Set Poetry to use Python 3.13
  command: poetry env use python3.13

- name: Install the backend
  command: poetry install --all-extras
  register: result
  changed_when: '"No dependencies to install or update" not in result.stdout'

- name: Create the devel directory
  file:
    path: "{{ devel_dir }}"
    state: directory

- name: Get the Tinystage CA cert
  get_url:
    url: https://{{ ipsilon_hostname }}/ca.crt
    dest: "{{ devel_dir }}/ca.crt"
    validate_certs: false

- name: Load the content of the Tinystage CA cert
  slurp:
    src: "{{ devel_dir }}/ca.crt"
  register: ca_crt

- name: Find where certifi's CA bundle is located
  command:
    cmd: poetry run python -c "import certifi; print(certifi.where())"
  register: _ca_bundle_path
  changed_when: False

- name: Put tinystage root CA in the list of CA's for certifi
  blockinfile:
    block: "{{ ca_crt.content | b64decode }}"
    path: "{{ _ca_bundle_path.stdout }}"

#
# OIDC Registration
#
## Frontend
- name: Register the frontend with the OIDC provider
  command:
    cmd: poetry run oidc-register --debug --public-client --output-file {{ devel_dir }}/oidc-frontend.json https://{{ ipsilon_hostname }}/idp/openidc/ http://localhost:5173/callback
    creates: "{{ devel_dir }}/oidc-frontend.json"

- name: Load the frontend's OIDC config
  ansible.builtin.slurp:
    src: "{{ devel_dir }}/oidc-frontend.json"
  register: oidc_frontend_config

- name: Extract the frontend's OIDC client_id
  set_fact:
    oidc_frontend_client_id: "{{ oidc_frontend_config['content'] | b64decode | from_json | json_query('web.client_id') }}"

## API
- name: Register the API with the OIDC provider
  command:
    cmd: poetry run oidc-register --debug --output-file {{ devel_dir }}/oidc-api.json https://{{ ipsilon_hostname }}/idp/openidc/ http://localhost:8000/
    creates: "{{ devel_dir }}/oidc-api.json"

