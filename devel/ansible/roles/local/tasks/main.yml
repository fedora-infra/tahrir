# Config files

- name: Create the frontend config file
  template:
    src: frontend.env.j2
    dest: "{{ top_dir }}/frontend/.env.development.local"
  notify: reload supervisord

- name: Create the backend config file
  template:
    src: tahrir.cfg.j2
    dest: "{{ devel_dir }}/tahrir.cfg"
  notify: reload supervisord

- name: Create the Alembic config file
  copy:
    src: alembic.ini
    dest: "{{ devel_dir }}/alembic.ini"

- name: Create the fedora-messaging config file for the API
  copy:
    src: fedora-messaging.toml
    dest: "{{ devel_dir }}/fedora-messaging.toml"


- name: Get the badges
  git:
    repo: https://pagure.io/fedora-badges.git
    dest: "{{ devel_dir }}/fedora-badges"

- name: Create or update the database
  command: poetry run flask tahrir sync-db
  environment:
    FLASK_CONFIG: "{{ devel_dir }}/tahrir.cfg"
    FLASK_APP: "{{ top_dir }}/tahrir/app.py"
    FLASK_DEBUG: 1
  args:
    creates: "{{ devel_dir }}/tahrir.db"

- name: Load the fedora badges in the DB
  command: poetry run flask tahrir load-badges
  environment:
    FLASK_CONFIG: "{{ devel_dir }}/tahrir.cfg"
    FLASK_APP: "{{ top_dir }}/tahrir/app.py"
    FLASK_DEBUG: 1

- name: Install the frontend
  command:
    cmd: npm install
    chdir: "{{ top_dir }}/frontend"
  register: result
  changed_when: '"up to date" not in result.stdout'

- name: Create the supervisord config file
  template:
    src: supervisord.conf.j2
    dest: "{{ top_dir }}/supervisord.conf"
  notify: reload supervisord

- name: Start supervisord
  command:
    cmd: supervisord
    chdir: "{{ top_dir }}"
    creates: "{{ devel_dir }}/supervisor.sock"
